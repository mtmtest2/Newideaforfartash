<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>فرتاش | آموزشگاه آنلاین زبان</title>
    <meta name="description" content="کلاس‌های زنده و دوره‌های آفلاین زبان با اساتید مجرب فرتاش." />
    <!--head-->
    <meta name="theme-color" content="#f8f1e7" />
    <link rel="icon" href="/favicon-night.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fartash-theme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          if (t === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#111c36');
          /*__THEME_PRELOADS__*/
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
