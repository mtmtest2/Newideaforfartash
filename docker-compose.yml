# Fartash — Docker + Caddy.
#
# Mode A (default, this file): the site runs behind your EXISTING Caddy reverse proxy.
#   - no ports are published; the container joins your proxy's Docker network (CADDY_NETWORK)
#   - your Caddy forwards the domain to  fartash-web:80   (see deploy/caddy/README.md)
#
# Mode B (standalone, this container terminates HTTPS itself): use docker-compose.standalone.yml
#
# Usage:  cp .env.example .env   # then edit
#         docker compose up -d --build
services:
  fartash-web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://mrmdev.xyz}
    image: fartash-web:${IMAGE_TAG:-performance-caddy}
    container_name: fartash-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    # Optional: uncomment to reach the container directly from the VPS for testing (curl http://127.0.0.1:8080)
    # ports:
    #   - "127.0.0.1:8080:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    name: ${CADDY_NETWORK:-caddy}
    external: true
