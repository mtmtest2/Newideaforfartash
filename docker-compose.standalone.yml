# Fartash — Mode B: standalone. This container is the public web server and gets HTTPS certificates itself.
# Only use this when nothing else on the VPS listens on ports 80/443.
#
# Usage:  docker compose -f docker-compose.standalone.yml up -d --build
services:
  fartash-web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://mrmdev.xyz}
    image: fartash-web:${IMAGE_TAG:-performance-caddy}
    container_name: fartash-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-mrmdev.xyz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data       # certificates — keep this volume between deploys
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
