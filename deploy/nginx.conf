# Fartash static site — nginx server block. Serve the `dist/` folder produced by `npm run build`.
# Caching policy:
#   /assets/*  -> content-hashed filenames (JS, CSS, fonts, images, video): cache 1 year, immutable
#   HTML       -> always revalidate (so a deploy is picked up immediately; ETag keeps it cheap)
#   other root files (favicons, robots.txt, sitemap.xml, llms.txt) -> 1 day
server {
    listen 80;
    server_name mrmdev.xyz;          # adjust
    root /var/www/fartash/dist;      # adjust: the built dist/ folder
    index index.html;

    # compression for text assets (images/video/woff2 are already compressed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
    # brotli on; brotli_types ...;   # if the ngx_brotli module is installed

    location /assets/ {
        # no `always`: only successful responses are cached for a year, never a 404
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;         # never fall back to HTML for a missing asset
    }

    # Machine-readable files must never get the HTML fallback (crawlers/agents would parse HTML as robots/JSON).
    location /.well-known/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Prerendered routes: /teachers -> /teachers/index.html (no redirect); unknown paths -> SPA shell.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }

    location ~* ^/(favicon-[a-z]+\.png|robots\.txt|sitemap\.xml|llms\.txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Byte-range requests (needed so browsers can stream the intro video instead of downloading it whole)
    # are on by default for static files in nginx; don't disable them with `max_ranges 0`.
}
